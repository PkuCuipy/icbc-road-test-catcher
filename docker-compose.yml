# ICBC road test appointment catcher.
# See README.md for env var descriptions and how to find LOCATION_IDS.
services:
  icbc-catcher:
    build: .
    container_name: icbc-road-test-catcher
    environment:
      - TZ=America/Vancouver
      - USER_LAST_NAME=YourLastName  # TODO: change to yours
      - USER_LICENSE_NUMBER=1234567  # TODO: change to yours
      - USER_KEYWORD=your_keyword_here  # TODO: change to yours
      - USER_GMAIL=your.email@gmail.com   # TODO: change to yours
      - USER_GMAIL_APP_PASSWORD=your_16_character_app_password  # TODO: change to yours
      - DESIRED_DATE_START=2025-06-24   # TODO: change to yours
      - DESIRED_DATE_END=2025-06-30     # TODO: change to yours
      - LOCATION_IDS=  # TODO: comma-separated. e.g. LOCATION_IDS=9,93 (See README for how to find IDs. For example, 9=Vancouver, 93=Richmond)
      - NOTIFY_EMAILS=  # Optional. Comma-separated emails to notify on successful booking, e.g. a@x.com,b@y.com
    volumes:
      - ./logs:/app/logs  # verbose logs written here, timestamped per run
